name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Corepack reads the `packageManager` field in package.json and installs
      # the pinned pnpm version. Must run before setup-node so pnpm is on PATH
      # when setup-node configures its cache.
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Commitlint (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
